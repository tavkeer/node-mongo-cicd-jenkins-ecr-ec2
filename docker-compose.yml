services:
  app:
    image: ${IMAGE_URI}:${IMAGE_TAG}
    container_name: node-mongo-app
    ports:
      - "${APP_PORT}:3000"
    environment:
      PORT: 3000
      MONGO_URI: ${MONGO_URI}
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:

